        new File(serverDir, 'eula.txt').text = accepted
        new File(serverDir, 'server.properties').text = '''server-ip=127.0.0.1
server-port=0
level-name=world
level-type=minecraft:flat
level-seed=42
generate-structures=false
online-mode=false
spawn-protection=0
view-distance=2
simulation-distance=2
sync-chunk-writes=true
max-tick-time=120000
allow-nether=false
gamemode=creative
difficulty=peaceful
enable-rcon=false
enable-query=false
'''
        runeStressResultFile.text = 'RUNNING'
    }
    doLast {
        def result = runeStressResultFile.text
        if (!result.startsWith('PASS:')) throw new GradleException('Dedicated rune stress failed: ' + result)
    }
}

