def deepCraftStressDatapack = layout.projectDirectory.dir('src/testFixtures/deep-crafting-datapack').asFile
['TenThousandRuneStress': 'ten-thousand-rune-stress', 'DeepCraftStress': 'deep-craft-stress'].each { suffix, fixtureName ->
    def fixtureServerDirectory = layout.buildDirectory.dir(fixtureName + '/server').get().asFile
    def fixtureResultFile = layout.buildDirectory.file(fixtureName + '/result.txt').get().asFile
    def fixtureDatapackDirectory = new File(fixtureServerDirectory, 'world/datapacks/deep-crafting-stress')
    tasks.named('run' + suffix).configure {
        doFirst {
            fixtureServerDirectory.mkdirs()
            def accepted = acceptedServerEula.exists() ? acceptedServerEula.text : ''
            if (!(accepted =~ /(?m)^\s*eula\s*=\s*true\s*$/).find()) throw new GradleException('This isolated fixture requires the already accepted run-server/eula.txt.')
            new File(fixtureServerDirectory, 'eula.txt').text = accepted
            new File(fixtureServerDirectory, 'server.properties').text = '''server-ip=127.0.0.1
server-port=0
level-name=world
level-type=minecraft:flat
level-seed=42
generate-structures=false
online-mode=false
spawn-protection=0
view-distance=2
simulation-distance=2
sync-chunk-writes=true
max-tick-time=120000
allow-nether=false
gamemode=creative
difficulty=peaceful
enable-rcon=false
enable-query=false
'''
            if (suffix == 'DeepCraftStress') {
                if (!deepCraftStressDatapack.isDirectory()) throw new GradleException('Deep crafting stress datapack is missing from src/testFixtures/deep-crafting-datapack.')
                java.nio.file.Files.walk(deepCraftStressDatapack.toPath()).withCloseable { files ->
                    files.filter { java.nio.file.Files.isRegularFile(it) }.forEach { source ->
                        def target = fixtureDatapackDirectory.toPath().resolve(deepCraftStressDatapack.toPath().relativize(source))
                        java.nio.file.Files.createDirectories(target.parent)
                        java.nio.file.Files.copy(source, target, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    }
                }
            }
            fixtureResultFile.text = 'RUNNING'
        }
        doLast {
            def result = fixtureResultFile.text
            if (!result.startsWith('PASS:')) throw new GradleException('Dedicated stress fixture failed: ' + result)
        }
    }
}

tasks.named('jar') { from('LICENSE') }
