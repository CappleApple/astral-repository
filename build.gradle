plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
version = mod_version
group = 'com.cappleapple.astralrepository'
base { archivesName = "astral_repository-${minecraft_version}-neoforge" }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
sourceSets {
    test { java.srcDirs = ['src/test/java'] }
    main {
        java.srcDirs = ['src/main/java']
        java.exclude 'com/cappleapple/astralrepository/gametest/**'
        resources.srcDirs = ['src/main/resources']
    }
}
neoForge {
    version = neo_version
    runs {
        clientSmoke { client(); gameDirectory = layout.projectDirectory.dir('build/smoke-client'); systemProperty 'astral_repository.testClient', 'true'; systemProperty 'astral_repository.modernClientSmoke', 'true' }
        client { client(); gameDirectory = layout.projectDirectory.dir('run-client') }
        server { server(); programArgument '--nogui'; gameDirectory = layout.projectDirectory.dir('run-server'); if(project.hasProperty('smokeTest')) systemProperty 'astral_repository.portSmoke', 'true' }
    }
    mods { astral_repository { sourceSet sourceSets.main } }
    unitTest { enable(); testedMod = mods.astral_repository }
}
repositories {
    maven { url = 'https://maven.theillusivec4.top/' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.terraformersmc.com/releases' }
    maven { url = 'https://api.modrinth.com/maven' }
}
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly 'top.theillusivec4.curios:curios-neoforge:16.0.0+26.2:api'
    compileOnly 'mezz.jei:jei-26.3-common-api:31.1.0.12'
    compileOnly 'mezz.jei:jei-26.3-neoforge-api:31.1.0.12'
    compileOnly 'dev.emi:emi-neoforge:1.1.24+1.21.1:api'
    compileOnly 'vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE'
    compileOnly 'maven.modrinth:jade:26.3.1+neoforge'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25; options.compilerArgs += ['-Xmaxerrs', '1000'] }
tasks.named('processResources').configure {
    inputs.properties(version: project.version, minecraft_version: minecraft_version, neo_version: neo_version)
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version, minecraft_version: minecraft_version, neo_version: neo_version }
}
tasks.named('jar', Jar).configure { exclude 'com/cappleapple/astralrepository/smoke/**'; exclude 'com/cappleapple/astralrepository/port/PortRuntimeSmoke.class'; exclude 'data/astral_repository/structure/empty_workshop.nbt'; exclude 'data/astral_repository/structure/empty_geode.nbt' }

tasks.named('test', Test).configure { useJUnitPlatform(); maxHeapSize = '2G' }

ext.modernCommonSource = "src/main/java"
ext.modernClientSmokeSource = "src/clientSmoke/java"
apply from: "tools/modern-26.3.gradle"

tasks.named('jar') { from('LICENSE') }
